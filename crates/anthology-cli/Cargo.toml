[package]
name = "anthology-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The anthology binary: argv dispatch and the only std::env reader"
build = "build.rs"

[[bin]]
name = "anthology"
path = "src/main.rs"

[lints]
workspace = true

[features]
# GD2: a test build whose guard hook panics on a marker input (m-5).
panic-on-marker = ["anthology-guard/panic-on-marker"]

[dependencies]
anthology-core.workspace = true
anthology-pycompat.workspace = true
anthology-guard.workspace = true
anthology-memory.workspace = true
anthology-runtime.workspace = true
lexopt.workspace = true

[dev-dependencies]
anthology-testkit.workspace = true
tempfile.workspace = true
