[package]
name = "difftest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Port-time differential tests against the Python oracle (deleted at cutover)"

[[bin]]
name = "difftest"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anthology-pycompat.workspace = true
anthology-core = { workspace = true, features = ["test-clock"] }
anthology-shell.workspace = true
anthology-guard.workspace = true
anthology-settings.workspace = true
anthology-memory.workspace = true
anthology-runtime.workspace = true
anthology-testkit.workspace = true
# dev.* surfaces call the dev tool in-process (`<module>::run_in`), controller plumbing.
anthology-dev.workspace = true
proptest.workspace = true
tempfile.workspace = true
lexopt.workspace = true
sha2.workspace = true
# D-5: decode gzip and SQLite artifacts to compare their content (mem, memory.portable).
flate2.workspace = true
rusqlite.workspace = true
