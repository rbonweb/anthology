# Allowed divergences of the guard.check surface (GC-16).

[[divergence]]
class = "D-1"
reason = 'Python raised inside _check (RecursionError on hostile nesting, for one), which check() turns into an allow; the oracle marks it. Rust may block or match.'

[[divergence]]
class = "D-8"
case = "fw:1"
reason = 'Rust stricter: FW-H/FW-I G1 (FW-I rule 12, _pm_words). `npm --loglevel silent i puppeteer` is a bash-verified install the Python on rust allows; the Python reading is kept as well (union), so Rust never allows what Python blocks.'

