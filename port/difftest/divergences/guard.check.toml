reason = 'Rust stricter: owner direction, LR-G (past a cap the guard blocks, never allows). A fifth brace group is past the four _expand_braces rounds; guard_rules.py leaves it as text, Rust expands it as well (union) and blocks it (G3).'

[[divergence]]
class = "D-8"
