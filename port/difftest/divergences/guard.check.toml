# Allowed divergences of the guard.check surface (GC-16).

[[divergence]]
class = "D-1"
reason = 'Python raised inside _check (RecursionError on hostile nesting, for one), which check() turns into an allow; the oracle marks it. Rust may block or match.'

[[divergence]]
class = "D-8"
case = "fw:depth-cap-substitutions"
reason = 'Rust stricter: final review I-1. 13 nested `$(echo ...)` around `npx playwright install` go past the depth cap (12), so the text inside was never analyzed: Rust blocks it as too complex (G0); the Python on rust allows it unanalyzed.'

[[divergence]]
class = "D-8"
case = "fw:depth-cap-evals"
reason = 'Rust stricter: final review I-1. 13 `eval`s before `npx playwright install` go past the depth cap (12): Rust blocks it as too complex (G0); the Python on rust allows it unanalyzed.'

[[divergence]]
class = "D-8"
case = "fw:depth-cap-benign"
reason = 'Rust stricter: final review I-1. 13 `eval`s before `echo hi`: past the depth cap nothing is analyzed, so Rust blocks (G0) whatever the text is; the Python on rust allows it.'

[[divergence]]
class = "D-8"
case = "cap:1"
reason = 'Rust stricter: owner direction, LR-G (past a cap the guard blocks, never allows). A command nested in 13 shells is past MAX_DEPTH; guard_rules.py stops reading and allows, Rust blocks it as too complex (G0).'

[[divergence]]
class = "D-8"
case = "cap:2"
reason = 'Rust stricter: owner direction, LR-G (past a cap the guard blocks, never allows). A cd into a directory with more than 64 slashes is not tracked (MAX_CWD_DEPTH), so later relative words resolve against the old directory; guard_rules.py allows, Rust blocks it as too complex (G0).'

[[divergence]]
class = "D-8"
case = "cap:3"
reason = 'Rust stricter: owner direction, LR-G (past a cap the guard blocks, never allows). A profile path under 13 nested tool-input keys is past _MAX_WALK_DEPTH; guard_rules.py does not read it, Rust reads the whole input and blocks it (G3).'

[[divergence]]
class = "D-8"
case = "cap:4"
reason = 'Rust stricter: owner direction, LR-G (past a cap the guard blocks, never allows). A profile path over 4096 code points is past _MAX_PATH_STRING; guard_rules.py skips the word, Rust reads it and blocks it (G3).'

[[divergence]]
class = "D-8"
case = "cap:5"
reason = 'Rust stricter: owner direction, LR-G (past a cap the guard blocks, never allows). The 33rd brace alternative is past the _expand_braces limit of 32; guard_rules.py drops it, Rust expands it as well (union) and blocks it (G3).'

[[divergence]]
class = "D-8"
