# Allowed divergences of this DV2 surface (GC-16). The engine and the oracle mark each case they
# adjusted (crates/difftest/src/surfaces/dev_dv2.rs, port/difftest/oracle/dev_tools.py).

[[divergence]]
class = "D-2"
reason = "The OS error text in '[Errno N] <text>' up to the next ':', ')' or newline is hidden until P1 commits the errno tables (ruling R3); the errno number, the file names and the rest of the line are still compared."
