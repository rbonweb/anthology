# Allowed divergences of the memory.portable surface (GC-16). The oracle
# (port/difftest/oracle/memory_portable.py) marks D-1 and D-4 where it adjusted Python's
# result; the surface's D-2 hook marks every case whose output it rewrote. The entries carry
# no `case` on purpose: such an entry covers those marks only and can never waive a diff
# between the two sides (an entry with a `case` would also waive any other diff in the cases
# it matches). The marks fall only in the case categories named below (ids
# `seed:<n>-<label>`, `gen:<n>-<category>`, crates/difftest/src/surfaces/memory_portable.rs).
# The gzip files themselves are never compared byte for byte (D-5): the surface compares their
# 10-byte header and their decompressed tar stream, so D-5 needs no entry.

[[divergence]]
class = "D-4"
reason = "`cli` cases (seed:5-cli, gen:*-cli): argparse's own output (-h, a usage error) names the parser memory_portable.py, its prog; the port names it as the CLI shows it, anthology memory. The oracle runs main with the parser renamed, so argparse lays out the usage for that name; all the usage, help and error text is then compared."

[[divergence]]
class = "D-1"
reason = "`forged` cases (seed:*-forged-*, gen:*-forged): apply_import of a hand-forged plan whose new, conflicts, identical or blocked is a value Python cannot iterate (5, null) raises an uncaught TypeError; the port rejects the plan (ImportRejected: malformed plan) and writes nothing. The oracle writes that line as the expected result."

[[divergence]]
class = "D-2"
reason = "`corrupt` cases (seed:*-corrupt-*, gen:*-corrupt: truncated, byte-flipped, not-gzip and empty archives): the rejection 'not a readable memory archive: <text>' carries str() of the zlib, gzip or tarfile exception, which the port's decoder words its own way. The hook hides only the text after that prefix; the prefix, the rejection and the untouched tree are compared."
