# Allowed divergences of the memory.portable surface (GC-16). The oracle
# (port/difftest/oracle/memory_portable.py) marks D-1, D-4 and D-7 where it adjusted Python's
# result; the surface's D-2 and D-5 hooks mark every case whose output they rewrote. The
# entries carry no `case` on purpose: such an entry covers those marks only and can never
# waive a diff between the two sides (an entry with a `case` would also waive any other diff
# in the cases it matches). The marks fall only in the case categories named below (ids
# `seed:<n>-<label>`, `gen:<n>-<category>`, crates/difftest/src/surfaces/memory_portable.rs).

[[divergence]]
class = "D-5"
reason = "Cases that export (seed:1..4, gen:*-flow, gen:*-cli): the exported .tar.gz is not compared byte for byte, since the port's deflate bytes differ from zlib's. Its 10-byte gzip header and its decompressed tar stream (length and sha256) are compared exactly; its own sha256, which a plan and the CLI's dry run print, is shown as <export N> on both sides."

[[divergence]]
class = "D-4"
reason = "`cli` cases (seed:5-cli, gen:*-cli): argparse's own output (-h, a usage error) names the parser memory_portable.py, its prog; the port names it as the CLI shows it, anthology memory. The oracle runs main with the parser renamed, so argparse lays out the usage for that name; all the usage, help and error text is then compared."

[[divergence]]
class = "D-1"
reason = "`forged` cases (seed:*-forged-*, gen:*-forged): apply_import of a hand-forged plan whose new, conflicts, identical or blocked is a value Python cannot iterate (5, null) raises an uncaught TypeError; the port rejects the plan (ImportRejected: malformed plan) and writes nothing. The oracle writes that line as the expected result."

[[divergence]]
class = "D-2"
reason = "`corrupt` and `tarhdr` cases (gen:*-corrupt, gen:*-tarhdr: byte-flipped or truncated deflate data): zlib's own reason in 'not a readable memory archive: Error -3 while decompressing data: <reason>' (a read of member data) and 'not a readable memory archive: zlib error: Error -3 while decompressing data: <reason>' (tarfile reading a header), which the port's deflate decoder words its own way. The hook hides only <reason>: those prefixes, where and whether the read fails, every gzip text (Not a gzipped file, CRC check failed, Compressed file ended before ...) and every tarfile text are compared."

[[divergence]]
class = "D-7"
reason = "`tarhdr` cases (gen:*-tarhdr): a GNU sparse map number (PAX 0.0 offset or numbytes, 0.1 GNU.sparse.map, 1.0 map line) outside a 64-bit integer, which Python keeps as a big int, is refused by the port ('not a readable memory archive: sparse value out of range') as it parses it. The oracle runs tarfile's 3.12 sparse parsers with that bound at the same point and marks the cases where it refused; all the output is then compared."

[[divergence]]
class = "D-8"
case = "seed:*-forged-date-*"
reason = "MX1 review M-8, owner direction (Rust stricter): a hand-forged plan whose date would put '/', a NUL or '..' into a conflict's '<name>.imported-<date>.md' name. Python builds the name from it (and fails, or writes elsewhere); the port rejects the plan ('malformed plan date') before writing anything."
