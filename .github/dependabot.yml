version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /ci/images
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /ci/claude-code
    schedule:
      interval: weekly
    cooldown:
      # A freshly published release waits three days before it gets a PR.
      default-days: 3
