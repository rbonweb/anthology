version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /ci/images
    schedule:
      interval: weekly
    ignore:
      # The images are pinned to python:3.9 (macOS system python) and python:3.12;
      # a major/minor bump would silently change what CI covers. Digest and patch bumps flow.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
