name: upstream-watch

# Weekly: compare every vendored pin, the rtk upstream and the latest Claude Code release with
# upstream, and keep one issue per change (scripts/upstream_watch.py). Nothing is merged here;
# the issue names the command to run on a branch, and CI plus the evals are the gate.
on:
  schedule:
    - cron: "23 6 * * 1"   # weekly, Monday 06:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    outputs:
      claude_code_changed: ${{ steps.watch.outputs.claude_code_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare pins with upstream and sync issues
        id: watch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/upstream_watch.py

  trigger-evals:
    # A new Claude Code release also runs the evals. Issues created with GITHUB_TOKEN do not
    # trigger workflows, so this dispatches evals.yml directly. `actions: write` is what
    # workflow_dispatch needs, and it is granted to this job only. `!cancelled()` keeps the
    # trigger alive when another entry failed after the Claude Code issue was written (the
    # issue exists by then, so the release would not be "new" on the next run).
    needs: watch
    if: ${{ !cancelled() && needs.watch.outputs.claude_code_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the evals
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.repository.default_branch }}
        run: |
          if [ -f .github/workflows/evals.yml ]; then
            gh workflow run evals.yml --ref "$REF"
          else
            echo "evals.yml not present yet; nothing to trigger"
          fi
