name: evals

# Weekly (and on demand, and when upstream-watch sees a new Claude Code release): run the
# behaviour evals with the pinned Claude Code and gate them against evals/baseline.json
# (scripts/run-evals.sh). It costs real model calls, so it has no pull_request, pull_request_target
# or push trigger: it never runs for a fork. To evaluate a Claude Code bump, dispatch it on the
# Dependabot branch: gh workflow run evals.yml --ref <branch>.
on:
  schedule:
    - cron: "41 5 * * 2"   # weekly, Tuesday 05:41 UTC
  workflow_dispatch:
    inputs:
      max_cost_usd:
        description: Hard cost ceiling for the run, in USD
        required: false
        default: "20"
        type: string

permissions: {}

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    if: github.repository == 'rbonweb/anthology'
    runs-on: ubuntu-latest
    timeout-minutes: 180  # the evals (cases up to 120 min) plus the smokes that run after them
    permissions:
      contents: read
    steps:
      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set; the behaviour evals are skipped"
          fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Claude Code (postinstall links the native binary)
        if: steps.key.outputs.present == 'true'
        run: |
          npm ci --prefix ci/claude-code
          ci/claude-code/node_modules/.bin/claude --version
      - name: Run the behaviour evals
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_COST_USD: ${{ inputs.max_cost_usd || '20' }}
          CLAUDE_BIN: ci/claude-code/node_modules/.bin/claude
          DISABLE_AUTOUPDATER: "1"
          # A granted npx command (guard cases) must not fetch packages if a guard regresses.
          NPM_CONFIG_OFFLINE: "true"
          # Already the default under GITHUB_ACTIONS; set explicitly so it cannot silently
          # change: Bash subprocesses do not inherit the API key.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        run: |
          status=0
          scripts/run-evals.sh --ci --max-cost-usd "$MAX_COST_USD" || status=$?
          if [ "$status" = 3 ]; then
            echo "::error::No evals/baseline.json is committed; the results and a candidate baseline are in the evals-results artifact"
          fi
          exit "$status"
      - name: Upload the results
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-results
          path: evals/results/
          retention-days: 30
          if-no-files-found: ignore
