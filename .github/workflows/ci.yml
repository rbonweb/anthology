name: ci

on:
  push:
    branches: [main, build]
  # labeled/unlabeled: the `full-ci` label asks for every test (ci/jobs/rust-scope.sh reads it).
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # A manual run is a full run, and fills the Rust build cache for a branch.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run (runners are shared).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vendor-check:
    # Needs git and network: rebuild every vendored tree from its pinned upstream and diff it
    # against the committed tree (anthology-dev vendor check in the pinned Rust image).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: vendor check
        run: scripts/dev.sh vendor check

  version-bump:
    # A plugin whose files changed must carry a higher plugin.json version than its latest
    # released tag (`<plugin>--v<version>`, for example `anthology--v0.4.1`); a plugin with no such
    # tag is unreleased and not gated. Needs git history and tags (fetch-depth: 0 fetches both);
    # scripts/dev.sh runs the check in the pinned Rust image.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check plugin version bumps
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/dev.sh version-bump "$BASE" "$HEAD_SHA"

  plugin-validate:
    # Validate the marketplace manifest and each plugin with the Claude Code version pinned in
    # ci/claude-code.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    strategy:
      fail-fast: false
      matrix:
        target: [., plugins/anthology, plugins/anthology-guardrails, plugins/anthology-superpowers]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Claude Code (postinstall links the native binary)
        run: npm ci --prefix ci/claude-code
      - name: Claude Code version
        run: ci/claude-code/node_modules/.bin/claude --version
      - name: claude plugin validate --strict
        env:
          TARGET: ${{ matrix.target }}
        run: ci/claude-code/node_modules/.bin/claude plugin validate --strict "$TARGET"

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the history reachable from the tested commit for secrets
        run: |
          GITLEAKS_IMAGE=$(awk '$1 == "FROM" {print $2}' ci/images/gitleaks.Dockerfile)
          docker run --rm -v "$PWD":/repo:ro \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git --redact --no-banner --config /repo/.gitleaks.toml --log-opts="HEAD" /repo

  memory-diff:
    # Lists the memory notes a pull request adds, changes, renames or deletes (.claude/memory and
    # .claude/agent-memory) in the job summary: notes load into everyone's sessions, so reviewers
    # read them like code. A listing, not a gate, and it comments nothing on the PR (fork-safe).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: List the memory changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/dev.sh memory-diff "$BASE" "$HEAD_SHA" >>"$GITHUB_STEP_SUMMARY"

  startup-budget:
    # The per-agent startup budget (anthology-dev startup-budget and the test_roster port
    # `startup_budget`, PLAN section 5) and the session-start output budget (the
    # test_session_start `budget` ports, U8's 9,000 characters), in the pinned Rust image.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Startup budgets in the pinned Rust image (design §14.2, m-18)
        run: |
          scripts/dev.sh startup-budget
          scripts/rust-test.sh run cargo test --locked -p repo-tests --test roster startup_budget
          scripts/rust-test.sh run cargo test --locked -p anthology-runtime budget

  mods:
    # The anthology plugin's Claude Code mods: `claude plugin validate --strict` and
    # `claude plugin test` with the pinned Claude Code, in the pinned node image.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mods
        run: ci/jobs/mods.sh

  cli-syntax:
    # The Claude Code CLI surface the plugins and the evals rely on (U4): every `claude plugin`
    # subcommand answers --help with the flags we use, `validate --strict` passes for each plugin
    # and `tag --dry-run` names the release tag. No model is called and no credentials are needed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Claude Code (postinstall links the native binary)
        run: npm ci --prefix ci/claude-code
      - name: Claude Code version
        run: ci/claude-code/node_modules/.bin/claude --version
      - name: CLI syntax smoke
        run: ci/jobs/cli-syntax.sh

  atl-test:
    # $ATL_TEST: atl's own cargo test suite in the pinned Rust image (ci/images/rust.Dockerfile).
    # Runs when atl/ or a crate atl builds changes, and on every push (rust-scope).
    needs: rust-scope
    if: needs.rust-scope.outputs.atl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the atl tests in the pinned Rust image
        run: scripts/atl-test.sh
      - name: Run the release binary with the network off
        run: scripts/atl-net-test.sh

  atl-test-macos:
    # atl's own tests on macOS, where temporary folders sit behind /private/var symlinks that
    # Linux does not have (three atl tests failed in atl-release.yml's macOS builds after a pull
    # request passed). Only for a change to atl/ itself, and on every push (rust-scope).
    needs: rust-scope
    if: needs.rust-scope.outputs.atl_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain, so the cache key is made for it
        working-directory: atl
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: atl
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: atl-test-macos
        run: ci/jobs/atl-test-macos.sh

  # The Rust port (design §14.1). Each job runs ci/jobs/<job>.sh; the lane that owns a job edits
  # its script, never this file (plan §0.2). Placeholder scripts echo their name until then.

  rust-lint:
    # cargo fmt --check and clippy -D warnings, in the pinned Rust image.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust-lint
        run: ci/jobs/rust-lint.sh

  rust-scope:
    # What this run needs (ci/jobs/rust-scope.sh, rules in ci/scope-rules.tsv): on a pull request
    # the changed crates and every crate that depends on them, the golden surfaces of those
    # crates, atl and fuzz only when they, or a crate they build, changed, and macOS only for
    # platform-sensitive paths. A push to build or main, a manual run, the `full-ci` label, a
    # `[full-ci]` commit message, or a change to the test machinery itself runs everything.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      full: ${{ steps.scope.outputs.full }}
      atl: ${{ steps.scope.outputs.atl }}
      atl_macos: ${{ steps.scope.outputs.atl_macos }}
      fuzz: ${{ steps.scope.outputs.fuzz }}
      run_linux: ${{ steps.scope.outputs.run_linux }}
      run_macos: ${{ steps.scope.outputs.run_macos }}
      linux_matrix: ${{ steps.scope.outputs.linux_matrix }}
      macos_matrix: ${{ steps.scope.outputs.macos_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: rust-scope
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # cargo metadata reads the manifests with the runner's toolchain; the pinned one would
          # be downloaded just for that.
          RUSTUP_TOOLCHAIN: stable
        run: ci/jobs/rust-scope.sh "$BASE" "$HEAD_SHA" >>"$GITHUB_OUTPUT"

  rust-test-linux-shard:
    # cargo test in the pinned Rust image (with git, busybox and node), plain and --all-features:
    # `rest` shards (the crates' tests, split by ci/test-weights.tsv) and a `replay` shard (the
    # difftest golden surfaces, one test each). The shards are the rust-scope matrix; the cache
    # keeps the registry, the toolchain and the dependency build (ci/jobs/rust-cache.sh).
    name: rust-test-linux-shard (${{ matrix.name }})
    needs: rust-scope
    if: needs.rust-scope.outputs.run_linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.rust-scope.outputs.linux_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cache folders
        env:
          CACHE_DIR: ${{ runner.temp }}/rust-cache
        run: ci/jobs/rust-cache.sh dirs "$CACHE_DIR"
      - name: restore the Rust cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/rust-cache/cargo
            ${{ runner.temp }}/rust-cache/rustup
            ${{ runner.temp }}/rust-cache/target
          key: rust-linux-${{ matrix.name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'ci/images/rust.Dockerfile') }}
          restore-keys: |
            rust-linux-${{ matrix.name }}-
      - name: cache volumes
        env:
          CACHE_DIR: ${{ runner.temp }}/rust-cache
        run: ci/jobs/rust-cache.sh volumes "$CACHE_DIR"
      - name: rust-test-linux
        env:
          FEATURES: ${{ matrix.features }}
          PART: ${{ matrix.part }}
          PACKAGES: ${{ matrix.packages }}
          SURFACES: ${{ matrix.surfaces }}
        run: ci/jobs/rust-test-linux.sh "$FEATURES" "$PART"
      - name: trim the cache to the dependencies
        env:
          CACHE_DIR: ${{ runner.temp }}/rust-cache
        run: ci/jobs/rust-cache.sh trim "$CACHE_DIR"
      # Only a push or a manual run saves: a pull request reads the cache of its base branch.
      - name: save the Rust cache
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/rust-cache/cargo
            ${{ runner.temp }}/rust-cache/rustup
            ${{ runner.temp }}/rust-cache/target
          key: rust-linux-${{ matrix.name }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'ci/images/rust.Dockerfile') }}

  rust-test-linux:
    # The required check. Green when every Linux shard passed, or when rust-scope needed none.
    needs: [rust-scope, rust-test-linux-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shards
        env:
          SCOPE: ${{ needs.rust-scope.result }}
          RUN: ${{ needs.rust-scope.outputs.run_linux }}
          SHARDS: ${{ needs.rust-test-linux-shard.result }}
        run: ci/jobs/rust-gate.sh rust-test-linux "$SCOPE" "$RUN" "$SHARDS"

  rust-test-macos-shard:
    # cargo test on macOS, plain (then the shims) and --all-features (then the ledger's macOS
    # listings): the whole workspace on a push, and on a pull request only the affected crates,
    # only when it touched platform-sensitive paths (the `macos` rules of ci/scope-rules.tsv).
    name: rust-test-macos-shard (${{ matrix.name }})
    needs: rust-scope
    if: needs.rust-scope.outputs.run_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.rust-scope.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain, so the cache key is made for it
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.features }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: rust-test-macos
        env:
          FEATURES: ${{ matrix.features }}
          PACKAGES: ${{ matrix.packages }}
        run: ci/jobs/rust-test-macos.sh "$FEATURES"

  rust-test-macos:
    # The required check. Green when both macOS shards passed, or when rust-scope needed none.
    needs: [rust-scope, rust-test-macos-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shards
        env:
          SCOPE: ${{ needs.rust-scope.result }}
          RUN: ${{ needs.rust-scope.outputs.run_macos }}
          SHARDS: ${{ needs.rust-test-macos-shard.result }}
        run: ci/jobs/rust-gate.sh rust-test-macos "$SCOPE" "$RUN" "$SHARDS"

  deny:
    # cargo deny check (advisories, bans, licenses, sources) and the serde_json tree check.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: deny
        run: ci/jobs/deny.sh

  shims-distros:
    # The repo-tests shim suite in the alpine, debian-slim (+node) and ubuntu images (BS1).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shims-distros
        run: ci/jobs/shims-distros.sh

  shellcheck:
    # shellcheck -s sh on every shim, in the pinned image (BS1).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: ci/jobs/shellcheck.sh

  ledger:
    # anthology-dev ledger check --report (F4a).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ledger
        run: ci/jobs/ledger.sh

  fuzz-build:
    # Every fuzz target compiles on the pinned nightly and survives 1,000 runs (F1). The long
    # runs are fuzz.yml's, weekly. Runs when fuzz/ or a crate the targets build changes, and on
    # every push (rust-scope).
    needs: rust-scope
    if: needs.rust-scope.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fuzz-build
        run: ci/jobs/fuzz-build.sh

  lock-fresh:
    # Informational: warns (annotation and job summary) when this PR changes what the pinned
    # anthology binary is built from, so it needs a new anthology-bin release before the next
    # plugin release. Never fails the PR (continue-on-error) and has no write token. Needs the
    # history and the tags (fetch-depth: 0); the check runs in the pinned Rust image.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: lock-fresh
        run: ci/jobs/lock-fresh.sh
