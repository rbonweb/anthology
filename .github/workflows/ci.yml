name: ci

on:
  push:
    branches: [main, build]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests in the pinned Python image
        run: |
          PYTHON_IMAGE=$(awk '$1 == "FROM" {print $2}' ci/images/python.Dockerfile)
          docker run --rm -v "$PWD":/w -w /w "$PYTHON_IMAGE" \
            sh -c "pip install -q --require-hashes -r tests/requirements.txt && python -m unittest discover -s tests -v"

  test-py39:
    # The vendoring script must keep running on the macOS system python3 (3.9).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests in the pinned Python 3.9 image
        run: |
          PYTHON_IMAGE=$(awk '$1 == "FROM" {print $2}' ci/images/python39.Dockerfile)
          docker run --rm -v "$PWD":/w -w /w "$PYTHON_IMAGE" \
            sh -c "pip install -q --require-hashes -r tests/requirements.txt && python -m unittest discover -s tests -v"

  vendor-check:
    # Needs git and network (the Docker test image has neither): rebuild every vendored
    # tree from its pinned upstream and diff it against the committed tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: vendor.py check
        run: python3 scripts/vendor.py check
      - name: Vendor tests that need git (skipped in the Docker image)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --require-hashes -r tests/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -p 'test_vendor.py' -v

  memory-git:
    # The memory tests that need git (trust boundary, re-clone, linked worktrees, team merges)
    # skip in the Docker test images, which have no git, so they run here on the runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Memory tests with git
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --require-hashes -r tests/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -p 'test_memory_*.py' -v

  version-bump:
    # A plugin whose files changed must carry a higher plugin.json version than at the
    # merge base, once it has been released (a `<plugin>--v*` tag exists). Needs git history
    # and tags (fetch-depth: 0 fetches both), which the Docker test image does not have.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gate tests that need git (skipped in the Docker image)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --require-hashes -r tests/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -p 'test_version_bump.py' -v
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -p 'test_release.py' -v
      - name: Check plugin version bumps
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_version_bump.py "$BASE" "$HEAD_SHA"

  plugin-validate:
    # Validate each plugin with the Claude Code version pinned in ci/claude-code.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    strategy:
      fail-fast: false
      matrix:
        plugin: [anthology, anthology-guardrails, anthology-superpowers]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Claude Code (postinstall links the native binary)
        run: npm ci --prefix ci/claude-code
      - name: Claude Code version
        run: ci/claude-code/node_modules/.bin/claude --version
      - name: claude plugin validate --strict
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: ci/claude-code/node_modules/.bin/claude plugin validate --strict "plugins/$PLUGIN"

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the history reachable from the tested commit for secrets
        run: |
          GITLEAKS_IMAGE=$(awk '$1 == "FROM" {print $2}' ci/images/gitleaks.Dockerfile)
          docker run --rm -v "$PWD":/repo:ro \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git --redact --no-banner --config /repo/.gitleaks.toml --log-opts="HEAD" /repo

  taste-bridge:
    # The BrowserOS Neo bridge (design-taste-frontend/scripts/neo.mjs) is driven by a fake harness. It
    # needs `node` (the Docker test images have none, so those tests skip there). neo.mjs uses only
    # node: built-ins and runs on Node 18 or later, so the runner's default node is enough.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node version
        run: node --version
      - name: Bridge tests
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --require-hashes -r tests/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -p 'test_taste_bridge.py' -v

  setup-git:
    # The session-start and setup tests that need git (repo approval, memory cover) skip in the
    # Docker test images, which have no git, so they run here on the runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Session-start and setup tests with git
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --require-hashes -r tests/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -p 'test_se*.py' -v

  memory-diff:
    # Lists the memory notes a pull request adds, changes, renames or deletes (.claude/memory and
    # .claude/agent-memory) in the job summary: notes load into everyone's sessions, so reviewers
    # read them like code. A listing, not a gate, and it comments nothing on the PR (fork-safe).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: List the memory changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/memory_diff.py "$BASE" "$HEAD_SHA"

  startup-budget:
    # Runs two tests in the pinned Python image: test_roster `startup_budget` (the per-agent startup
    # budget, PLAN section 5) and test_session_start `budget` (the session-start output budget, U8's
    # 9,000 characters). The per-agent budgets live in scripts/startup_budget.py (enforced by
    # test_roster.test_startup_budget) and the session-start output budget in its test, not here. Each part runs once
    # its product files exist; from then on a missing test module fails (ImportError) and a filter
    # that matches no test fails (Python 3.12 unittest exits 5 when no test ran).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Startup budgets in the pinned Python image
        run: |
          PYTHON_IMAGE=$(awk '$1 == "FROM" {print $2}' ci/images/python.Dockerfile)
          docker run --rm -v "$PWD":/w -w /w "$PYTHON_IMAGE" sh -c '
            set -e
            pip install -q --require-hashes -r tests/requirements.txt
            cd tests
            if [ -d ../plugins/anthology/agents ]; then
              python -m unittest -v -k startup_budget test_roster
            else
              echo "::notice::no agents yet; per-agent startup budget not checked"
            fi
            if [ -f ../plugins/anthology/scripts/session_start.py ]; then
              python -m unittest -v -k budget test_session_start
            else
              echo "::notice::no session_start.py yet; session-start output budget not checked"
            fi'

  cli-syntax:
    # The Claude Code CLI surface the plugins and the evals rely on (U4): every `claude plugin`
    # subcommand answers --help with the flags we use, `validate --strict` passes for each plugin
    # and `tag --dry-run` names the release tag. No model is called and no credentials are needed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Claude Code (postinstall links the native binary)
        run: npm ci --prefix ci/claude-code
      - name: Claude Code version
        run: ci/claude-code/node_modules/.bin/claude --version
      - name: CLI syntax smoke
        run: python3 evals/smoke/smoke.py --claude ci/claude-code/node_modules/.bin/claude cli-syntax

  rtk-test:
    # $RTK_TEST: rtk's own cargo test suite in the pinned Rust image (ci/images/rust.Dockerfile).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the rtk tests in the pinned Rust image
        run: scripts/rtk-test.sh
      - name: Run the release binary with the network off
        run: scripts/rtk-net-test.sh
