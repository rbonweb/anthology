schema_version: "1.0"
name: route-ui-designer
description: 'The main session delegates the ui-designer job to anthology:ui-designer.'
tags: [routing]
plugins:
  - "../../plugins/anthology"
  - "../../plugins/anthology-guardrails"
  - "../../plugins/anthology-superpowers"
execution:
  prompt: 'You are working in an empty scratch folder. Delegate the following job to the single most suitable specialist agent; do not do it yourself and do not ask questions. Tell the agent to keep its answer under 150 words. Job: Build the hero section of a landing page for a coffee-subscription startup.'
  max_turns: 12
  timeout_seconds: 600
  model: opus
  allowed_tools: [Agent, Read, Glob, Grep, ToolSearch]
runs: 1
graders:
  - name: dispatched
    type: tool_used
    tool: Agent
    input_match: '"anthology:ui-designer"'
