schema_version: "1.0"
name: route-reviewer
description: 'The main session delegates the reviewer job to anthology:reviewer.'
tags: [routing]
plugins:
  - "../../plugins/anthology"
  - "../../plugins/anthology-guardrails"
  - "../../plugins/anthology-superpowers"
execution:
  prompt: 'You are working in an empty scratch folder. Delegate the following job to the single most suitable specialist agent; do not do it yourself and do not ask questions. Tell the agent to keep its answer under 150 words. Job: Review the most recent commit''s diff for bugs, security issues and tech debt before we merge it. Change nothing.'
  max_turns: 12
  timeout_seconds: 600
  model: opus
  allowed_tools: [Agent, Read, Glob, Grep, ToolSearch]
runs: 1
graders:
  - name: dispatched
    type: tool_used
    tool: Agent
    input_match: '"anthology:reviewer"'
