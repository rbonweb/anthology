schema_version: "1.0"
name: knowledge-ui-reviewer
description: 'anthology:ui-reviewer reads its Startup knowledge, in order, before its first Glob.'
tags: [knowledge-read, probe-u1]
plugins:
  - "../../plugins/anthology"
  - "../../plugins/anthology-guardrails"
  - "../../plugins/anthology-superpowers"
execution:
  prompt: 'Run the anthology:ui-reviewer agent with exactly this prompt: ''Startup check only: do your Startup reading, then use Glob once to list *.md files in the current folder, then reply DONE.'' Do not use any tool yourself other than Agent. Then report the agent''s reply.'
  max_turns: 12
  timeout_seconds: 600
  model: sonnet
  allowed_tools: [Agent, Read, Glob]
runs: 1
graders:
  - name: dispatched
    type: tool_used
    tool: Agent
    input_match: '"anthology:ui-reviewer"'
  - name: main-dispatches-first
    type: tool_order
    before: Agent
    after: {tool: Glob, input_match: '\*\.md'}
  - name: read-caveman
    type: tool_used
    tool: Read
    input_match: 'knowledge/caveman/SKILL\.md'
  - name: order-caveman
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/caveman/SKILL\.md'}
    after: {tool: Glob, input_match: '\*\.md'}
  - name: read-web-design-guidelines
    type: tool_used
    tool: Read
    input_match: 'knowledge/web-design-guidelines/SKILL\.md'
  - name: order-web-design-guidelines
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/web-design-guidelines/SKILL\.md'}
    after: {tool: Glob, input_match: '\*\.md'}
  - name: inorder-caveman-web-design-guidelines
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/caveman/SKILL\.md'}
    after: {tool: Read, input_match: 'knowledge/web-design-guidelines/SKILL\.md'}
  - name: read-web-review
    type: tool_used
    tool: Read
    input_match: 'knowledge/web-review/SKILL\.md'
  - name: order-web-review
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/web-review/SKILL\.md'}
    after: {tool: Glob, input_match: '\*\.md'}
  - name: inorder-web-design-guidelines-web-review
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/web-design-guidelines/SKILL\.md'}
    after: {tool: Read, input_match: 'knowledge/web-review/SKILL\.md'}
  - name: read-ds-design-critique
    type: tool_used
    tool: Read
    input_match: 'knowledge/design-skills/skills/design-critique/SKILL\.md'
  - name: order-ds-design-critique
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/design-skills/skills/design-critique/SKILL\.md'}
    after: {tool: Glob, input_match: '\*\.md'}
  - name: inorder-web-review-ds-design-critique
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/web-review/SKILL\.md'}
    after: {tool: Read, input_match: 'knowledge/design-skills/skills/design-critique/SKILL\.md'}
  - name: read-ds-accessibility-audit
    type: tool_used
    tool: Read
    input_match: 'knowledge/design-skills/skills/accessibility-audit/SKILL\.md'
  - name: order-ds-accessibility-audit
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/design-skills/skills/accessibility-audit/SKILL\.md'}
    after: {tool: Glob, input_match: '\*\.md'}
  - name: inorder-ds-design-critique-ds-accessibility-audit
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/design-skills/skills/design-critique/SKILL\.md'}
    after: {tool: Read, input_match: 'knowledge/design-skills/skills/accessibility-audit/SKILL\.md'}
  - name: read-avoid-ai-design
    type: tool_used
    tool: Read
    input_match: 'knowledge/avoid-ai-design/SKILL\.md'
  - name: order-avoid-ai-design
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/avoid-ai-design/SKILL\.md'}
    after: {tool: Glob, input_match: '\*\.md'}
  - name: inorder-ds-accessibility-audit-avoid-ai-design
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/design-skills/skills/accessibility-audit/SKILL\.md'}
    after: {tool: Read, input_match: 'knowledge/avoid-ai-design/SKILL\.md'}
