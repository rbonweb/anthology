schema_version: "1.0"
name: route-ui-reviewer
description: 'The main session delegates the ui-reviewer job to anthology:ui-reviewer.'
tags: [routing]
plugins:
  - "../../plugins/anthology"
  - "../../plugins/anthology-guardrails"
  - "../../plugins/anthology-superpowers"
execution:
  prompt: 'You are working in an empty scratch folder. Delegate the following job to the single most suitable specialist agent; do not do it yourself and do not ask questions. Tell the agent to keep its answer under 150 words. Job: Check the rendered landing page at http://localhost:3000 for visual polish and accessibility problems. Change no code.'
  max_turns: 12
  timeout_seconds: 600
  model: opus
  allowed_tools: [Agent, Read, Glob, Grep, ToolSearch]
runs: 1
graders:
  - name: dispatched
    type: tool_used
    tool: Agent
    input_match: '"anthology:ui-reviewer"'
