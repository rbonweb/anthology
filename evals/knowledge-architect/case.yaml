schema_version: "1.0"
name: knowledge-architect
description: 'anthology:architect reads its Startup knowledge, in order, before its first Glob.'
tags: [knowledge-read, probe-u1]
plugins:
  - "../../plugins/anthology"
  - "../../plugins/anthology-guardrails"
  - "../../plugins/anthology-superpowers"
execution:
  prompt: 'Run the anthology:architect agent with exactly this prompt: ''Startup check only: do your Startup reading, then use Glob once to list *.md files in the current folder, then reply DONE followed by the first heading of each skill preloaded into your context.'' Do not use any tool yourself other than Agent. Then report the agent''s reply.'
  max_turns: 12
  timeout_seconds: 600
  model: sonnet
  allowed_tools: [Agent, Read, Glob, Skill]
runs: 1
graders:
  - name: dispatched
    type: tool_used
    tool: Agent
    input_match: '"anthology:architect"'
  - name: main-dispatches-first
    type: tool_order
    before: Agent
    after: {tool: Glob, input_match: '\*\.md'}
  - name: read-caveman
    type: tool_used
    tool: Read
    input_match: 'knowledge/caveman/SKILL\.md'
  - name: order-caveman
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/caveman/SKILL\.md'}
    after: {tool: Glob, input_match: '\*\.md'}
  - name: read-system-design
    type: tool_used
    tool: Read
    input_match: 'knowledge/system-design/SKILL\.md'
  - name: order-system-design
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/system-design/SKILL\.md'}
    after: {tool: Glob, input_match: '\*\.md'}
  - name: inorder-caveman-system-design
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/caveman/SKILL\.md'}
    after: {tool: Read, input_match: 'knowledge/system-design/SKILL\.md'}
  - name: read-architecture
    type: tool_used
    tool: Read
    input_match: 'knowledge/architecture/SKILL\.md'
  - name: order-architecture
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/architecture/SKILL\.md'}
    after: {tool: Glob, input_match: '\*\.md'}
  - name: inorder-system-design-architecture
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/system-design/SKILL\.md'}
    after: {tool: Read, input_match: 'knowledge/architecture/SKILL\.md'}
  - name: read-testing-strategy
    type: tool_used
    tool: Read
    input_match: 'knowledge/testing-strategy/SKILL\.md'
  - name: order-testing-strategy
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/testing-strategy/SKILL\.md'}
    after: {tool: Glob, input_match: '\*\.md'}
  - name: inorder-architecture-testing-strategy
    type: tool_order
    before: {tool: Read, input_match: 'knowledge/architecture/SKILL\.md'}
    after: {tool: Read, input_match: 'knowledge/testing-strategy/SKILL\.md'}
  - name: preload-not-invoked
    type: tool_used
    tool: Skill
    min: 0
    max: 0
  - name: preload-quoted
    type: regex
    target: last_message
    pattern: 'Writing Plans'
