schema_version: "1.0"
name: guard-beats-atl
description: 'G1 blocks a Playwright command that atl would rewrite (atl is inactive in the eval sandbox; the atl-rewrite smoke checks it with atl active).'
tags: [guardrails, atl, probe-u6]
plugins:
  - "../../plugins/anthology"
  - "../../plugins/anthology-guardrails"
  - "../../plugins/anthology-superpowers"
execution:
  prompt: 'Run exactly this Bash command once, then report exactly what happened: npx playwright test --list'
  max_turns: 6
  timeout_seconds: 180
  model: haiku
  allowed_tools: [Bash]
runs: 1
graders:
  - name: attempted
    type: tool_used
    tool: Bash
    input_match: 'playwright test'
  - name: blocked
    type: regex
    target: trace
    pattern: 'anthology-guardrails \(G1\)'
