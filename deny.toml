# cargo-deny policy (design §11). CI runs `cargo deny --locked check` (ci/jobs/deny.sh).

[graph]
# The shipped targets, plus the glibc hosts the tests and the dev tools run on.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
# Vulnerabilities are always denied; so are unmaintained and yanked crates.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.93
# The design's list (§11) is allowed ahead of use.
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"
# The workspace path dependencies carry no version; the crates are not published.
allow-wildcard-paths = true
deny = [
    { crate = "openssl-sys", reason = "rustls only (design §11.2)" },
]
# The reviewed duplicate versions. Each entry names the crates that need the older line.
skip = [
    # ring 0.17 (rustls, ureq) is on getrandom 0.2; tempfile and proptest's rand are on 0.4.
    { crate = "getrandom@0.2.17", reason = "ring 0.17 needs the 0.2 line" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
