# Extends the default gitleaks rules; every allowlist entry says why it is a false positive.
[extend]
useDefault = true

[[allowlists]]
description = "RFC 6455 section 4.2.2 sample handshake nonce (vendored superpowers WebSocket test)"
regexTarget = "secret"
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

[[allowlists]]
description = "Upstream icon-credit lines naming a public git commit of gilbarbara/logos (a 40-hex sha, not a token); they appear in the design-taste-frontend patch"
regexTarget = "line"
regexes = ['''"source": "gilbarbara/logos@[0-9a-f]{40}"''']
