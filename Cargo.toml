# The Anthology Rust workspace (plan docs/superpowers/plans/2026-11-20-rust-port.md, task F1).
# Every dependency is declared here once, with an exact version (design §11). Lanes do not add
# crates or features; a change goes through the integrator's plumbing PR.
# rtk/ is its own workspace (the vendored fork), and fuzz/ is the cargo-fuzz workspace.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["rtk", "fuzz"]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Workspace crates. anthology-shell is listed for the other crates; its own Cargo.toml inherits
# nothing, because rtk builds it too (GC-18).
anthology-pycompat = { path = "crates/anthology-pycompat" }
anthology-shell = { path = "crates/anthology-shell" }
anthology-guard = { path = "crates/anthology-guard" }
anthology-core = { path = "crates/anthology-core" }
anthology-settings = { path = "crates/anthology-settings" }
anthology-memory = { path = "crates/anthology-memory" }
anthology-runtime = { path = "crates/anthology-runtime" }
anthology-testkit = { path = "crates/anthology-testkit" }
anthology-dev = { path = "crates/anthology-dev" }

# Design §11.2.
regex = "=1.13.2"
fancy-regex = "=0.20.2"
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
# Reading only in the shipped crates; export writes its own headers (m-20).
tar = { version = "=0.4.46", default-features = false }
sha2 = "=0.11.1"
# rustls with ring, plus the OS trust store (platform-verifier). No `json` (m-11), no `gzip`.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls", "platform-verifier"] }
libc = "=0.2.191"
lexopt = "=0.3.2"

# Design §11.2, dev only. The non-shipped crates (testkit, anthology-dev, difftest, repo-tests)
# may also use them as normal dependencies.
# Without the default `bit-set` feature: it would add a second bit-set line beside fancy-regex's.
proptest = { version = "=1.12.0", default-features = false, features = ["std", "fork", "timeout"] }
yaml-rust2 = { version = "=0.13.1", default-features = false }
tempfile = "=3.27.0"
# The RT2 TLS test server (testkit::http). ring, not aws-lc-rs: no C toolchain beyond cc.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[workspace.lints.cargo]
# F1 declares each crate's final dependency list before the code that uses it exists (plan §0.2).
# Back to "warn" at CO1, once every lane has landed (also in anthology-shell and fuzz).
unused_dependencies = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Unwind, so the guard can catch a panic and block (design §9.5).
panic = "unwind"
